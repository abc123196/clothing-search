<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>服飾商品查詢 Dashboard</title>
<style>
:root{--bg:#faf7f5;--card:#fff;--tx:#2b2326;--mut:#7a6f73;--ac:#d4577b;--bd:#eadfe2}
@media(prefers-color-scheme:dark){:root{--bg:#1c1719;--card:#2a2326;--tx:#f3eaed;--mut:#a89aa0;--ac:#f08aa8;--bd:#3b3135}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
header,main{max-width:1100px;margin:auto;padding:0 16px}
header{padding-top:20px}
h1{margin:0;font-size:22px}
.sub{color:var(--mut);font-size:13px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px;color:var(--ac)}
.bar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:14px}
input,select{padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.ph{position:relative;aspect-ratio:1/1;background:var(--bd)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.62);color:#fff;font-size:11px;padding:2px 8px;border-radius:99px}
.b{padding:10px 12px}
.n{font-weight:600}
.m{color:var(--mut);font-size:13px}
.p{color:var(--ac);font-weight:700;font-size:17px}
.low{color:#d0433a}
#msg{padding:30px 0;text-align:center;color:var(--mut)}#msg:empty{display:none}
@media(max-width:640px){.bar{grid-template-columns:1fr 1fr}.bar input{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <h1>服飾商品查詢 Dashboard</h1>
  <div class="sub">資料來源：TiDB Cloud → Colab 匯出 products.json → GitHub Pages（重新整理 F5 即更新）</div>
  <div class="stats" id="stats"></div>
  <div class="bar">
    <input id="q" placeholder="搜尋商品名稱、品牌、顏色…">
    <select id="cat"><option value="">全部分類</option></select>
    <select id="brand"><option value="">全部品牌</option></select>
    <select id="sort">
      <option value="id">依編號</option>
      <option value="pa">價格：低到高</option>
      <option value="pd">價格：高到低</option>
      <option value="st">庫存：少到多</option>
    </select>
  </div>
</header>
<main>
  <div id="msg">載入中…</div>
  <div class="grid" id="grid"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = [];

async function load() {
  try {
    const r = await fetch('data/products.json?refresh=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
    fill('cat', 'category_name');
    fill('brand', 'brand_name');
    render();
  } catch (e) {
    $('msg').textContent = '資料載入失敗：' + e.message + '（請用 GitHub Pages 或本機伺服器開啟，不要直接雙擊檔案）';
  }
}

function fill(id, key) {
  [...new Set(data.map(d => d[key]))].forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v;
    $(id).appendChild(o);
  });
}

function render() {
  const q = $('q').value.trim().toLowerCase(), c = $('cat').value, b = $('brand').value, s = $('sort').value;
  let list = data.filter(d =>
    (!c || d.category_name === c) && (!b || d.brand_name === b) &&
    (!q || [d.product_name, d.brand_name, d.color, d.product_id].join(' ').toLowerCase().includes(q)));
  const sorters = {
    id: (x, y) => x.product_id.localeCompare(y.product_id),
    pa: (x, y) => x.price - y.price,
    pd: (x, y) => y.price - x.price,
    st: (x, y) => x.stock_qty - y.stock_qty
  };
  list.sort(sorters[s]);

  const avg = list.length ? Math.round(list.reduce((a, d) => a + d.price, 0) / list.length) : 0;
  $('stats').innerHTML =
    `<div class="stat"><b>${list.length}</b>商品數</div>` +
    `<div class="stat"><b>$${avg.toLocaleString()}</b>平均價格</div>` +
    `<div class="stat"><b>${list.filter(d => d.stock_qty <= 5).length}</b>低庫存(≤5)</div>`;

  $('msg').textContent = list.length ? '' : '沒有符合條件的商品';
  $('grid').innerHTML = list.map(d => `
    <div class="card">
      <div class="ph">
        <img loading="lazy" src="${esc(d.image_url)}" alt="${esc(d.product_name)}">
        ${d.match_level === 'sample' ? '<span class="tag">示意圖</span>' : ''}
      </div>
      <div class="b">
        <div class="n">${esc(d.product_name)}</div>
        <div class="m">${esc(d.product_id)} · ${esc(d.category_name)} · ${esc(d.brand_name)}</div>
        <div class="m">${esc(d.color)} / ${esc(d.size)}</div>
        <div class="p">$${Number(d.price).toLocaleString()}</div>
        <div class="m ${d.stock_qty <= 5 ? 'low' : ''}">${d.stock_qty === 0 ? '已售完' : '庫存 ' + d.stock_qty}</div>
      </div>
    </div>`).join('');
}

['q', 'cat', 'brand', 'sort'].forEach(id => $(id).addEventListener('input', render));
load();
</script>
</body>
</html>
